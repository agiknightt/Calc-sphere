<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сфероэквивалента</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* Фиолетово-голубой градиент */
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { margin-top: 0; color: #333; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #2575fc; outline: none; box-shadow: 0 0 0 3px rgba(37,117,252,0.15); }
        .result-box { background: #eefbf2; padding: 15px; border-radius: 6px; border-left: 4px solid #34c759; margin-top: 25px; }
        .result-label { font-size: 12px; color: #34c759; text-transform: uppercase; font-weight: bold; }
        .result-value { font-size: 26px; font-weight: bold; color: #1e7e34; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Калькулятор сфероэквивалента</h2>
    
    <!-- Первое число (A2) — измените текст в теге <label> на ваше название -->
    <div class="input-group">
        <label for="inputA2">Sphere (+/-):</label>
        <input type="text" id="inputA2" placeholder="Введите число: со знаком +/-" inputmode="decimal">
    </div>

    <!-- Второе число (B2) — измените текст в теге <label> на ваше название -->
    <div class="input-group">
        <label for="inputB2">Cylinder (-):</label>
        <input type="text" id="inputB2" placeholder="Введите число: автоматически ставится минус" inputmode="decimal">
    </div>

    <!-- Итоговый результат -->
    <div class="result-box">
        <div class="result-label">Сфероэквивалента:</div>
        <div class="result-value" id="finalResult">0,00</div>
    </div>
</div>

<script>
    const inputA2 = document.getElementById('inputA2');
    const inputB2 = document.getElementById('inputB2');
    const finalResult = document.getElementById('finalResult');

    function parseStandardValue(rawText) {
        let valStr = rawText.trim().replace(',', '.');
        if (!valStr) return NaN;
        return parseFloat(valStr);
    }

    function calculate() {
        let valA2 = parseStandardValue(inputA2.value);
        let valB2 = parseStandardValue(inputB2.value);

        if (isNaN(valA2) || isNaN(valB2)) {
            finalResult.textContent = '0,00';
            return;
        }

        // 1. Принудительно делаем B2 отрицательным внутри расчета
        let b2 = -Math.abs(valB2);

        // 2. Считаем, сколько раз по -0.5 содержится в B2
        let steps = Math.floor(Math.abs(b2) / 0.5);

        // 3. К первому числу (A2) прибавляем по -0.25 за каждый шаг
        let result = valA2 + (steps * -0.25);

        // Выводим результат на экран с округлением до 2 знаков
        finalResult.textContent = result.toFixed(2).replace('.', ',');
    }

    // Запускаем расчет при изменении полей
    inputA2.addEventListener('input', calculate);
    inputB2.addEventListener('input', calculate);
</script>

</body>
</html>
