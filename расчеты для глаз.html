<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сферо-эквивалента</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #007aff; outline: none; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        .checkbox-group { display: flex; align-items: center; margin-top: 6px; margin-bottom: 15px; font-size: 13px; color: #666; user-select: none; }
        .checkbox-group input { margin-right: 6px; width: 16px; height: 16px; cursor: pointer; }
        .result-box { background: #eefbf2; padding: 15px; border-radius: 6px; border-left: 4px solid #34c759; margin-top: 25px; }
        .result-label { font-size: 12px; color: #34c759; text-transform: uppercase; font-weight: bold; }
        .result-value { font-size: 26px; font-weight: bold; color: #1e7e34; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Калькулятор сферо-эквивалента</h2>
    
    <!-- Первое число (A2) -->
    <div class="input-group">
        <label for="inputA2">Sph (любой знак +/-):</label>
        <input type="text" id="inputA2" placeholder="Например: 2 или 250" inputmode="text">
        <div class="checkbox-group">
            <input type="checkbox" id="doubleA2">
            <label for="doubleA2">Двузначное число перед запятой (при вводе без точек)</label>
        </div>
    </div>

    <!-- Второе число (B2) -->
    <div class="input-group">
        <label for="inputB2">Cyl (авто-минус):</label>
        <input type="text" id="inputB2" placeholder="Например: 125 или 1" inputmode="text">
        <div class="checkbox-group">
            <input type="checkbox" id="doubleB2">
            <label for="doubleB2">Двузначное число перед запятой (при вводе без точек)</label>
        </div>
    </div>

    <!-- Итоговый результат -->
    <div class="result-box">
        <div class="result-label">Итоговый результат:</div>
        <div class="result-value" id="finalResult">0,00</div>
    </div>
</div>

<script>
    const inputA2 = document.getElementById('inputA2');
    const inputB2 = document.getElementById('inputB2');
    const doubleA2 = document.getElementById('doubleA2');
    const doubleB2 = document.getElementById('doubleB2');
    const finalResult = document.getElementById('finalResult');

    function parseSmartValue(rawText, isDoubleDigit) {
        let valStr = rawText.trim().replace(',', '.');
        if (!valStr) return NaN;

        // Если пользователь сам поставил точку/запятую, берём число как есть
        if (valStr.includes('.')) {
            return parseFloat(valStr);
        }

        // Если вбиты только цифры (и возможно минус) без точек
        let isNegative = valStr.startsWith('-');
        let digitsOnly = valStr.replace('-', '');

        // Если ввели 3 или более цифр сплошным текстом (например, 925 или 1450)
        if (digitsOnly.length >= 3) {
            let num = parseFloat(digitsOnly) / 100;
            return isNegative ? -num : num;
        }

        // Если ввели обычное короткое число (например, 1, 2, 12, -5)
        return parseFloat(valStr);
    }

    function calculate() {
        let valA2 = parseSmartValue(inputA2.value, doubleA2.checked);
        let valB2 = parseSmartValue(inputB2.value, doubleB2.checked);

        if (isNaN(valA2) || isNaN(valB2)) {
            finalResult.textContent = '0,00';
            return;
        }

        // 1. Принудительно делаем B2 отрицательным внутри расчета
        let b2 = -Math.abs(valB2);

        // 2. Считаем, сколько раз по -0.5 содержится в B2
        let steps = Math.floor(Math.abs(b2) / 0.5);

        // 3. К первому числу (A2) прибавляем по -0.25 за каждый шаг
        let result = valA2 + (steps * -0.25);

        // Выводим результат на экран с округлением до 2 знаков
        finalResult.textContent = result.toFixed(2).replace('.', ',');
    }

    // Запускаем расчет при любом изменении
    inputA2.addEventListener('input', calculate);
    inputB2.addEventListener('input', calculate);
    doubleA2.addEventListener('change', calculate);
    doubleB2.addEventListener('change', calculate);
</script>

</body>
</html>
